name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPhone app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f QuitSmoke.zip
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q QuitSmoke.zip -d "$RUNNER_TEMP/source"
          test -d "$RUNNER_TEMP/source/QuitSmoke/QuitSmoke.xcodeproj"
          echo "PROJECT_DIR=$RUNNER_TEMP/source/QuitSmoke" >> "$GITHUB_ENV"

      - name: Build without code signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project QuitSmoke.xcodeproj \
            -scheme QuitSmoke \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/QuitSmoke.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/package/Payload/QuitSmoke.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/QuitSmoke-unsigned.ipa" Payload
          test -s "$RUNNER_TEMP/QuitSmoke-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/QuitSmoke-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuitSmoke-unsigned-ipa
          path: ${{ runner.temp }}/QuitSmoke-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

